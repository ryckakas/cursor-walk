name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Every job name here is a required check on main. Renaming one silently stops
# requiring it, so update branch protection in the same change.

# Actions are pinned to a commit SHA because a tag can be moved after review.

# Read-only: nothing here pushes, comments or publishes.
permissions:
  contents: read

# A new push makes a PR's previous run irrelevant. Main is never cancelled, so
# every merged commit keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version composer.json allows. Add the next minor on its release day,
        # not after a bug report from someone running it.
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      # Exact dev pins make an advisory against one actionable.
      - name: Audit dependencies
        run: composer audit

      # Each check is the composer script contributors run locally, with extra flags
      # passed after `--`, so CI and a local run cannot drift apart.
      - name: Check code style
        run: composer cs

      - name: Static analysis
        run: composer stan -- --no-progress

      # A floor rather than a printed percentage, which let coverage rot.
      - name: Tests and coverage floor
        run: composer coverage

      # Coverage proves a line ran; mutation testing proves an assertion noticed it change.
      - name: Mutation testing
        run: composer mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infection-report-php-${{ matrix.php }}
          path: build/infection/
          if-no-files-found: ignore
          retention-days: 14

      # The GitHub example is not run: it hits the live API and is best-effort by design.
      - name: "Smoke test: offline example"
        run: php examples/offline-example.php

  complexity:
    # Syntax-only, so one run covers every PHP version.
    name: Cognitive complexity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: bonsai-lint
        run: composer complexity

  api:
    # A release is a promise about the public API. An intentional break is declared
    # in .roave-backward-compatibility-check.xml and CHANGELOG.md; see AGENTS.md.
    name: Public API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The comparison base is the latest release tag.
          fetch-depth: 0
          persist-credentials: false

      # The checker needs PHP 8.4+, so it lives in tools/bc-check; in require-dev it
      # would break the PHP 8.2 and 8.3 installs.
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install the checker
        run: composer install --working-dir=tools/bc-check --no-interaction --no-progress

      - name: Audit the checker's dependencies
        run: composer audit --working-dir=tools/bc-check

      - name: Backward compatibility
        run: composer bc -- --format=console --format=github-actions

  workflows:
    name: Workflow security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exact release, so new audits arrive with a deliberate bump, not an unrelated PR.
      - name: Install zizmor
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: zizmor@1.30.1

      # The token lets zizmor verify that each pinned commit belongs to its action's repository.
      - name: zizmor
        run: zizmor --format github .github
        env:
          GH_TOKEN: ${{ github.token }}
