name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Every step below is a BLOCKER. No step carries continue-on-error, so a non-zero
# exit fails the job, and these job names are required status checks on main
# (`gh api repos/:owner/:repo/branches/main/protection`). Exit codes worth
# knowing: php-cs-fixer --dry-run returns 8 when a file needs fixing, phpstan
# returns 1 on any finding, phpunit returns non-zero on failures — and, because
# phpunit.xml sets failOnWarning / failOnRisky / failOnDeprecation, on those too.
#
# If a job here is ever renamed, update the required-checks list in the branch
# protection settings in the SAME change: a required check that no longer matches
# a job name silently stops being required, and PRs become mergeable with no CI.
#
# Actions are pinned to a full commit SHA with the release in a trailing comment;
# a tag can be moved to other code after review, a commit cannot. Dependabot
# moves both together. The "Workflow security" job below enforces all of this.

# Every job only reads the checkout: nothing here pushes, comments or publishes.
permissions:
  contents: read

# A new push to a PR makes the previous run's result irrelevant. A push to main
# is never cancelled, so every merged commit keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # composer.json allows php >=8.2, so every released version it permits is
        # tested. Add the next minor here on its release day, not after a bug
        # report from someone running it.
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      # Dev dependencies are pinned to exact versions, which is what makes an
      # advisory against one actionable instead of "probably already fixed".
      - name: Audit dependencies
        run: composer audit

      # Every check below is the composer script a contributor runs locally:
      # `composer check` reproduces the fast gates, `composer check:ci` all of
      # them. Extra flags are forwarded with `--` rather than duplicated into a
      # divergent raw command.
      - name: Check code style
        run: composer cs

      - name: Static analysis
        run: composer stan -- --no-progress

      # Runs the suite, writes Clover, and fails below the line-coverage floor in
      # tools/check-coverage.php. Printing the percentage and moving on let it rot.
      - name: Tests and coverage floor
        run: composer coverage

      # Line coverage proves a line executed; MSI proves an assertion noticed it
      # changing. Floors live in infection.json5.
      - name: Mutation testing
        run: composer mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infection-report-php-${{ matrix.php }}
          path: build/infection/
          if-no-files-found: ignore
          retention-days: 14

      # The offline example is the acceptance-gate smoke test: zero network,
      # zero configuration. examples/github-api-example.php is deliberately NOT
      # run here — it talks to the live GitHub API and is best-effort by design.
      - name: "Smoke test: offline example"
        run: php examples/offline-example.php

  complexity:
    # Syntax-only, so it does not depend on the PHP version and runs once rather
    # than per matrix entry. The threshold lives in bonsai-lint.toml and the
    # accepted findings in .bonsai-lint-baseline.json; the version is pinned in
    # the `complexity` composer script, and npx comes from the runner's Node.
    name: Cognitive complexity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: bonsai-lint
        run: composer complexity

  workflows:
    # The workflows are audited like code: pinned actions, least-privilege
    # tokens, no credentials left in the checkout, no template injection.
    name: Workflow security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # An exact release: new audits arrive with a deliberate bump, not with an
      # unrelated pull request.
      - name: Install zizmor
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: zizmor@1.30.1

      # The token lets zizmor check that every pinned commit belongs to its
      # action's repository and that no pinned release has a known advisory.
      - name: zizmor
        run: zizmor --format github .github
        env:
          GH_TOKEN: ${{ github.token }}
