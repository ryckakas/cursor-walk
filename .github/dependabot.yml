version: 2

# Exact pins never drift, so Dependabot is how they move: one reviewed PR per bump.
# The 7-day cooldown lets a malicious or broken release be yanked before it lands here.
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels:
      - dependencies
    groups:
      # One PR for the dev toolchain, because its tools are exercised together.
      dev-tooling:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # The API checker's own install. Nothing in it ships, so one grouped PR is enough.
  - package-ecosystem: composer
    directory: /tools/bc-check
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels:
      - dependencies
    groups:
      bc-check:
        patterns:
          - '*'

  # zizmor and bonsai-lint are pinned where Dependabot cannot see them, so they move by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels:
      - dependencies
