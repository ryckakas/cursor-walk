version: 2

# Dev dependencies are pinned to exact versions (no carets), which trades
# "silently drifts" for "never moves". Dependabot is the other half of that
# trade: it proposes each bump as its own PR, CI runs the full gate against it,
# and the pin is updated deliberately instead of at install time.
#
# Cooldown holds a release for seven days before proposing it: a malicious or
# broken publish is usually caught and yanked within the week, before it lands
# here. With no semver-specific overrides it applies to major, minor and patch.
#
# There are no runtime dependencies to watch — `require` is `php` alone.
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels:
      - dependencies
    groups:
      # One PR for the toolchain rather than four: they are all dev-only, and
      # reviewing them together is how they get exercised together.
      dev-tooling:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # The backward-compatibility checker's separate install, pinned exactly with a
  # committed lock. One grouped PR, because nothing here ships and the "Public
  # API" job re-running is the whole review.
  - package-ecosystem: composer
    directory: /tools/bc-check
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels:
      - dependencies
    groups:
      bc-check:
        patterns:
          - '*'

  # The workflows pin each action to a commit with the release in a comment;
  # Dependabot moves both. zizmor and bonsai-lint are pinned inside a workflow
  # input and a composer script, where it cannot see them, so they move by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels:
      - dependencies
